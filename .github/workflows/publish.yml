name: Publish

on:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  Check:
    uses: ./.github/workflows/check.yml
  Publish:
    needs: [Check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci
      - run: bun b

      - name: Publish to Chrome/Edge/Firefox stores
        uses: creeperkatze/extension-publish@797030bc8a9f26541989b92ee174151f36e12975 # v1.1.1
        with:
          # Chrome Web Store
          chrome-client-id: ${{ secrets.CHROME_CLIENT_ID }}
          chrome-client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          chrome-refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          chrome-publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          chrome-extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          chrome-zip-path: web-ext-artifacts/youtube-volume-scroll_{version}_chromium.zip

          # Firefox Add-ons
          firefox-api-key: ${{ secrets.FIREFOX_API_KEY }}
          firefox-api-secret: ${{ secrets.FIREFOX_API_SECRET }}
          firefox-extension-id: ${{ secrets.FIREFOX_EXTENSION_ID }}
          firefox-xpi-path: web-ext-artifacts/youtube-volume-scroll_{version}_firefox.xpi
          firefox-license: MIT

          # Edge Add-ons
          edge-api-key: ${{ secrets.EDGE_API_KEY }}
          edge-client-id: ${{ secrets.EDGE_CLIENT_ID }}
          edge-product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          edge-zip-path: web-ext-artifacts/youtube-volume-scroll_{version}_chromium.zip
